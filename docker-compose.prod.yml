# =============================================================================
# 星图(StarMap) Production Docker Compose — 2c4G 阿里云适配版
# 目标资源：2 vCPU / 4 GB RAM
# 启动：docker compose -f docker-compose.prod.yml up -d
# =============================================================================

name: starmap-prod

services:
  # ---------- Backend API + Celery Worker (单容器双进程) ----------
  # 2c4G 适配：合并 celery-worker 与 backend 到同一镜像，用 supervisord
  # 拉起 uvicorn (1 worker) + celery worker (1 concurrency)，节省一个容器的开销。
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: starmap-backend:2026.07
    container_name: starmap-backend-prod
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    command:
      - ./entrypoint.sh
      - supervisord
      - -c
      - /etc/supervisor/conf.d/starmap.conf
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks:
      - starmap-net

  # ---------- Frontend (Nginx + TLS) ----------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: starmap-frontend:prod
    container_name: starmap-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./secrets/ssl:/etc/nginx/ssl:ro
    environment:
      VITE_API_BASE_URL: /api/v1
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN required (set in .env.production or pass via shell)}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped
    networks:
      - starmap-net

  # ---------- Neo4j (Graph Database) ----------
  # 2c4G 适配：heap 256M，pagecache 128M，禁用 APOC
  neo4j:
    image: neo4j:5-community
    container_name: starmap-neo4j-prod
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
      - NEO4J_server_bolt_tls__level=REQUIRED
      - NEO4J_server_bolt_tls__certificate__name=neo4j.cert.pem
      - NEO4J_server_bolt_tls__key_name=neo4j.key.pem
    volumes:
      - neo4j_data_prod:/data
      - neo4j_logs_prod:/logs
      - ./secrets/neo4j:/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 800M
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    networks:
      - starmap-net

  # ---------- PostgreSQL (Relational Database) ----------
  # 2c4G 适配：shared_buffers 256M
  postgres:
    image: postgres:16
    container_name: starmap-postgres-prod
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - effective_cache_size=768MB
    environment:
      - POSTGRES_USER=starmap
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=starmap
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./secrets/postgres:/etc/postgresql/certs:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ -f /etc/postgresql/certs/enable-ssl.sh ]; then
          mkdir -p /docker-entrypoint-initdb.d
          cp /etc/postgresql/certs/enable-ssl.sh /docker-entrypoint-initdb.d/00-enable-ssl.sh
          chmod +x /docker-entrypoint-initdb.d/00-enable-ssl.sh
        fi
        exec /usr/local/bin/docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starmap -d starmap"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    networks:
      - starmap-net

  # ---------- Redis (Cache / Message Queue) ----------
  redis:
    image: redis:7-alpine
    container_name: starmap-redis-prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-starmap_redis_2024}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    restart: unless-stopped
    networks:
      - starmap-net

  # ---------- ChromaDB (Vector Database) ----------
  # 2c4G 适配：保留但压低 limit
  chroma:
    image: chromadb/chroma:0.5.3
    container_name: starmap-chroma-prod
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data_prod:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    restart: unless-stopped
    networks:
      - starmap-net

# ═══════════════════════════════════════════════
# Volumes — named for data persistence
# ═══════════════════════════════════════════════
volumes:
  neo4j_data_prod:
    driver: local
  neo4j_logs_prod:
    driver: local
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  chroma_data_prod:
    driver: local

# ═══════════════════════════════════════════════
# Network
# ═══════════════════════════════════════════════
networks:
  starmap-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
