server {
    listen 80;
    server_name _;
    # W1-T6 fix (API-01): HTTP → HTTPS 301 重定向（生产启用）。
    # 调试期可临时注释此行（注意：仍允许 80 端口访问，与"强制 HTTPS"语义相悖）。
    return 301 https://$host$request_uri;

    # ── 安全响应头 (P0 API-04 修复) ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 允许 self + 内联样式(Element Plus 需要) + 字体 + 图表
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理到后端服务
    # W1-T3 fix (P0-10): 后端 `app.main:144` 把 router 挂在 `/api/v1`
    # 下，nginx 必须保留 `/v1` 段。之前 `proxy_pass ...:8000/api/;`
    # 会把前端的 `/api/v1/auth/login` 改写成 `/api/auth/login`，后端
    # 无此路由 → 404。补 `/v1/` 让 nginx 透传到 `:8000/api/v1/`。
    location /api/ {
        proxy_pass http://starmap-backend-prod:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # public-deploy-preflight 2026-08-20 (P0): SSE 专用 location。
    # 否则全局 proxy_read_timeout 30s 会把 dashboard SSE 长连接每 30s 切断。
    location ~ ^/api/v1/(dashboard/realtime|pipeline/events|pipeline/realtime)$ {
        proxy_pass http://starmap-backend-prod:8000/api/v1$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：所有路由指向 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── HTTPS server (W1-T6 fix · P0 API-01) ──
# 生产启用步骤：
#   1) 把证书与私钥放入 ./secrets/ssl/{cert.pem,key.pem}；
#   2) docker-compose.prod.yml 把 ./secrets/ssl 挂到 /etc/nginx/ssl/；
#   3) 私钥文件权限 600。
# 证书生成（自签名，dev）：
#   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem \
#     -days 365 -nodes -subj "/CN=starmap.local"
# 生产建议用 Let's Encrypt + certbot 自动化。
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：强制浏览器一年内全部走 HTTPS（带子域）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 复用 HTTP server 的所有响应头与 location
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://starmap-backend-prod:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # public-deploy-preflight 2026-08-20 (P0): SSE 专用 location（见 HTTP server 同段注释）
    location ~ ^/api/v1/(dashboard/realtime|pipeline/events|pipeline/realtime)$ {
        proxy_pass http://starmap-backend-prod:8000/api/v1$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
