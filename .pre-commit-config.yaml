# StarMap pre-commit hooks
# Install:  pre-commit install
# Run all:  pre-commit run --all-files

repos:
  # ── Python: ruff lint + format ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (format)
        files: ^backend/

  # ── JS/TS: eslint (manual) ──
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint src/ --max-warnings=0'
        language: system
        types_or: [javascript, jsx, ts, tsx, vue]
        files: ^frontend/src/
        stages: [manual]

      - id: vue-tsc
        name: vue-tsc type-check
        entry: bash -c 'cd frontend && npx vue-tsc --noEmit'
        language: system
        types_or: [ts, tsx, vue]
        files: ^frontend/src/
        stages: [manual]

  # ── Security: detect secrets in staged files ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Git hygiene ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
