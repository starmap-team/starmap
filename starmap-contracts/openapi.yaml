          type: string
          minLength: 8
          maxLength: 128
        role:
          type: string
          pattern: "^(admin|user)$"
        email:
          type: string
          format: email
          nullable: true
        must_change_password:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          nullable: true
          pattern: "^(admin|user)$"
        is_active:
          type: boolean
          nullable: true
        must_change_password:
          type: boolean
          nullable: true
        email:
          type: string
          format: email
          nullable: true

