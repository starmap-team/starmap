openapi: "3.0.3"
info:
  title: "星图 StarMap API"
  description: "人才能力星云导航系统 - 后端 API 契约"
  version: "1.0.0"
  contact:
    name: "StarMap Team"
  x-summary: "人才技能图谱知识系统全量 API"

servers:
  - url: "http://localhost:8000/api/v1"
    description: "本地开发环境"
  - url: "https://api.starmap.dev/api/v1"
    description: "评审环境"

security:
  - BearerAuth: []

paths:
  # ──────────────────────── 系统 ────────────────────────
  /health:
    get:
      operationId: healthCheck
      summary: "健康检查"
      tags: [系统]
      responses:
        "200":
          description: "服务正常"
          content:
            application/json:
              schema:
                type: object
                required: [status, version, env]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: "ok"
                  version:
                    type: string
                    example: "1.0.0"
                  env:
                    type: string
                    example: "development"

  # ──────────────────────── 认证 ────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      summary: "用户登录"
      description: "用户名+密码认证，返回 access+refresh token 对"
      tags: [认证]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: "用户名或密码错误 / 账号锁定 / 账号停用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Redis 不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: "刷新令牌"
      description: "用 refresh token 换取新的 access token"
      tags: [认证]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "刷新成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: "刷新令牌无效或已过期"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Redis 不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: authLogout
      summary: "用户登出"
      description: "撤销 refresh token（尽力而为）"
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: "登出成功"
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    description: "被撤销的 token 数量"
        "503":
          description: "Redis 不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: authMe
      summary: "当前用户信息"
      description: "返回当前认证用户的完整信息（数据库真实数据，非 JWT 解码）"
      tags: [认证]
      responses:
        "200":
          description: "用户信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: "未认证或令牌无效"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "用户不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/change-password:
    post:
      operationId: authChangePassword
      summary: "修改密码"
      description: "自助修改密码（需提供旧密码）"
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "密码修改成功"
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed:
                    type: boolean
        "400":
          description: "原密码错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "未认证"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "用户不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      summary: "忘记密码"
      description: "发起密码重置流程（始终返回成功以避免邮箱枚举）"
      tags: [认证]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: "重置请求已提交"
          content:
            application/json:
              schema:
                type: object
                required: [submitted]
                properties:
                  submitted:
                    type: boolean
                  token:
                    type: string
                    nullable: true
                    description: "开发环境返回重置令牌，生产环境为 null"
        "503":
          description: "Redis 不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/reset-password:
    post:
      operationId: authResetPassword
      summary: "重置密码"
      description: "使用 /forgot-password 发出的令牌完成密码重置"
      tags: [认证]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: "密码重置成功"
          content:
            application/json:
              schema:
                type: object
                required: [reset]
                properties:
                  reset:
                    type: boolean
        "401":
          description: "令牌无效或已过期"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Redis 不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────────────── 信息抽取 ────────────────────────
  /extract/jd:
    post:
      operationId: extractJd
      summary: "职位描述技能抽取"
      description: "从职位描述文本中提取技能图谱节点，含幻觉评分"
      tags: [信息抽取]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionRequest"
      responses:
        "200":
          description: "抽取成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "422":
          description: "校验失败（JD 内容为空或抽取 pipeline 报错）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "LLM 服务不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "内部错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /extract/resume:
    post:
      operationId: extractResume
      summary: "简历技能抽取"
      description: "上传简历文件（PDF/Word），从中抽取个人技能图谱"
      tags: [信息抽取]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "简历文件（支持 .pdf, .docx, .doc）"
      responses:
        "200":
          description: "抽取成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "400":
          description: "文件类型不支持或读取失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "校验失败（抽取 pipeline 报错）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "LLM 服务不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "内部错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────────────── 简历解析 ────────────────────────
  /resume/upload:
    post:
      operationId: uploadResume
      summary: "简历上传解析"
      description: "上传简历文件并返回结构化抽取结果（含 MIME 校验与魔术字节校验）"
      tags: [简历解析]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "简历文件（支持 .pdf, .docx, .doc，最大 10MB）"
      responses:
        "200":
          description: "抽取成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "400":
          description: "文件类型不支持或读取失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "文件过大"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "校验失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "LLM 服务不可用"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────────────── 岗位管理 ────────────────────────
  /positions:
    get:
      operationId: listPositions
      summary: "岗位列表"
      description: "返回系统中所有已发现的岗位"
      tags: [岗位管理]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: industry
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "岗位列表"
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PositionNode"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

  /positions/{position_id}:
    get:
      operationId: getPositionDetail
      summary: "岗位详情"
      description: "获取单个岗位的完整信息，包含技能要求"
      tags: [岗位管理]
      parameters:
        - name: position_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "岗位详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionNode"
        "404":
          description: "岗位不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /positions/discover:
    post:
      operationId: discoverPosition
      summary: "触发岗位发现"
      description: "触发自动化岗位发现流水线：涌现检测 → 聚类 → 定义生成 → 幻觉防控"
      tags: [岗位管理]
      responses:
        "200":
          description: "发现完成"
          content:
            application/json:
              schema:
                type: object
                required: [status, emerging_skills, count, skills_analyzed]
                properties:
                  status:
                    type: string
                    example: "completed"
                  emerging_skills:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  skills_analyzed:
                    type: integer
        "500":
          description: "发现失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────────────── 图谱查询 ────────────────────────
  /graph/position/{position_id}/skills:
    get:
      operationId: getPositionSkills
      summary: "岗位技能图谱"
      description: "获取指定岗位的技能依赖子图"
      tags: [图谱查询]
      parameters:
        - name: position_id
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          description: "递归查询深度（含技能先修关系）"
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: "技能子图"
          content:
            application/json:
              schema:
                type: object
                required: [position, skills, edges]
                properties:
                  position:
                    $ref: "#/components/schemas/PositionNode"
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillNode"
                  edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphEdge"
        "404":
          description: "岗位不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /graph/overview:
    get:
      operationId: getGraphOverview
      summary: "领域概览"
      description: "返回 KnowledgeArea 节点 + 聚合统计，用于第一层领域视图"
      tags: [图谱查询]
      parameters:
        - name: group_by
          in: query
          description: "分组方式"
          schema:
            type: string
            enum: [domain, tech_stack, level]
            default: domain
      responses:
        "200":
          description: "领域概览"
          content:
            application/json:
              schema:
                type: object
                required: [domains, connections, total_positions, total_skills]
                properties:
                  domains:
                    type: array
                    items:
                      type: object
                      required: [id, name, position_count, skill_count, color]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        position_count:
                          type: integer
                        skill_count:
                          type: integer
                        color:
                          type: string
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphEdge"
                  total_positions:
                    type: integer
                  total_skills:
                    type: integer

  /graph/ka/{ka_id}/positions:
    get:
      operationId: getKAPositions
      summary: "KA 下的岗位列表"
      description: "返回指定 KnowledgeArea 下的 Position 节点及其与 Skill 的 REQUIRES 关系"
      tags: [图谱查询]
      parameters:
        - name: ka_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "KA 岗位列表"
          content:
            application/json:
              schema:
                type: object
                required: [ka_id, ka_name, positions, position_skill_edges]
                properties:
                  ka_id:
                    type: string
                  ka_name:
                    type: string
                  positions:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphNode"
                  position_skill_edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphEdge"

  # ──────────────────────── 匹配诊断 ────────────────────────
  /match/position:
    post:
      operationId: matchPosition
      summary: "人岗匹配"
      description: "将个人的技能集与目标岗位进行匹配度计算"
      tags: [匹配诊断]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "200":
          description: "匹配完成"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "400":
          description: "请求参数错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /match/diagnose:
    post:
      operationId: diagnoseMatch
      summary: "匹配诊断（别名）"
      description: "/match/position 的便捷别名，委托至同一逻辑"
      tags: [匹配诊断]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "200":
          description: "匹配完成"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "400":
          description: "请求参数错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /match/result/{match_id}:
    get:
      operationId: getMatchResult
      summary: "匹配结果详情"
      description: "获取之前触发的匹配诊断完整结果"
      tags: [匹配诊断]
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "匹配结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "404":
          description: "匹配记录不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /match/history:
    get:
      operationId: getMatchHistory
      summary: "匹配历史"
      description: "获取最近的匹配结果列表"
      tags: [匹配诊断]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: "匹配历史列表"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        match_id:
                          type: string
                        target_position:
                          type: string
                        match_score:
                          type: number
                        matched_skills:
                          type: array
                          items:
                            type: string
                        created_at:
                          type: string

  /match/competitiveness/{position}:
    get:
      operationId: getCompetitiveness
      summary: "竞争力分析"
      description: "获取指定岗位的竞争力分析数据"
      tags: [匹配诊断]
      parameters:
        - name: position
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "竞争力分析结果"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /match/batch:
    post:
      operationId: batchMatch
      summary: "批量匹配"
      description: "批量执行人岗匹配，最多 20 条"
      tags: [匹配诊断]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMatchRequest"
      responses:
        "200":
          description: "批量匹配结果"
          content:
            application/json:
              schema:
                type: object
                required: [results, total]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer

  /match/recommend:
    post:
      operationId: recommendPositions
      summary: "反向匹配推荐"
      description: "给定用户技能，推荐合适的岗位（反向匹配）"
      tags: [匹配诊断]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseMatchRequest"
      responses:
        "200":
          description: "推荐结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseMatchResponse"

  # ──────────────────────── 演化分析 ────────────────────────
  /evolution/trends:
    get:
      operationId: getEvolutionTrends
      summary: "演化趋势"
      description: "技能热度趋势、岗位变迁时间线、新兴岗位预警"
      tags: [演化分析]
      parameters:
        - name: category
          in: query
          schema:
            type: string
            description: "技能分类筛选"
        - name: days
          in: query
          schema:
            type: integer
            default: 90
            minimum: 7
            maximum: 730
          description: "分析时间窗口（天）"
      responses:
        "200":
          description: "趋势列表"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvolutionTrend"

  /evolution/analyze:
    post:
      operationId: triggerEvolutionAnalysis
      summary: "触发演化分析"
      description: "触发全量或增量演化分析流水线"
      tags: [演化分析]
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 90
            minimum: 7
            maximum: 730
      responses:
        "202":
          description: "分析已触发"
          content:
            application/json:
              schema:
                type: object
                required: [message, task_id]
                properties:
                  message:
                    type: string
                    example: "queued"
                  task_id:
                    type: string
                  days:
                    type: integer

  /evolution/changelog/{identifier}:
    get:
      operationId: getEvolutionChangelog
      summary: "演化变更记录"
      description: "获取指定岗位的技能变更历史"
      tags: [演化分析]
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          description: "岗位标识符"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "200":
