      type: object
      required: [id, event, actor, action, detail, ip, created_at]
      properties:
        id:
          type: string
        event:
          type: string
        actor:
          type: string
        action:
          type: string
        detail:
          type: string
        ip:
          type: string
        created_at:
          type: string
          format: date-time

    # ──────────────────────── 数据源健康 ────────────────────────
    DatasourcesHealthResponse:
