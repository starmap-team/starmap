                type: string
                nullable: true
              completed_at:
                type: string
                nullable: true
              progress:
                type: number
              duration_ms:
                type: integer
              records_processed:
                type: integer
              errors:
                type: array
                items:
                  type: string
              retry_count:
                type: integer
