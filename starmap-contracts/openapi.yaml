        system_output:
          type: object
          additionalProperties: true
        use_llm_judge:
          type: boolean
          default: false
        judge_prompt_version:
          type: string
          nullable: true

    PairwiseRequest:
      type: object
      required: [output_a, output_b]
      properties:
        output_a:
          type: object
          additionalProperties: true
        output_b:
          type: object
          additionalProperties: true

    BatchJudgeRequest:
      type: object
      required: [golden_file, system_file]
      properties:
