            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "计划不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /learning/plan/{plan_id}/progress:
    put:
      operationId: updateSkillProgress
      summary: "更新技能进度"
      description: "更新学习计划中特定技能的进度"
      tags: [学习中心]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgressRequest"
      responses:
        "200":
          description: "进度已更新"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillProgressItem"
        "404":
          description: "技能未找到"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /learning/plan/{plan_id}/skills:
    post:
      operationId: addSkillToPlan
      summary: "添加技能到计划"
      description: "向已有学习计划添加新技能"
      tags: [学习中心]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_name]
              properties:
                skill_name:
                  type: string
                  minLength: 1
                importance:
                  type: string
                  default: bonus
                estimated_hours:
                  type: number
                  default: 20.0
      responses:
        "200":
          description: "技能已添加"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillProgressItem"

  /learning/recommendations:
    get:
      operationId: getLearningRecommendations
      summary: "学习推荐"
      description: "获取个性化学习推荐（基于计划、岗位或热门技能）"
      tags: [学习中心]
      parameters:
        - name: plan_id
          in: query
          schema:
            type: string
          description: "学习计划 ID"
        - name: position
          in: query
          schema:
            type: string
          description: "目标岗位"
      responses:
        "200":
          description: "推荐列表"
          content:
            application/json:
              schema:
                type: object
                required: [items, total_items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecommendationItem"
                  total_items:
                    type: integer

  # ──────────────────────── 数据源管理 ────────────────────────
  /datasources:
    get:
      operationId: listDatasources
      summary: "数据源列表"
      description: "获取所有数据源配置（按权威度降序）"
      tags: [数据源管理]
      responses:
        "200":
          description: "数据源列表"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceResponse"

  /datasources/{source_id}:
    get:
      operationId: getDatasourceDetail
      summary: "数据源详情"
      description: "获取指定数据源的详细配置和统计"
      tags: [数据源管理]
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "数据源详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceResponse"
        "404":
          description: "数据源不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasources/health:
    get:
      operationId: getDatasourcesHealth
      summary: "数据源健康检查"
      description: "数据源健康检查汇总 — 各源状态 + 最近管线运行状态"
      tags: [数据源管理]
      responses:
        "200":
          description: "健康检查汇总"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasourcesHealthResponse"

  /datasources/{source_id}/stats:
    get:
      operationId: getDatasourceStats
      summary: "数据源统计"
      description: "获取数据源日/周/月采集量、质量趋势"
      tags: [数据源管理]
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: "数据源统计"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceStatsResponse"
        "404":
          description: "数据源不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────────────── 闭环验证 ────────────────────────
  /loop/run:
    post:
      operationId: runLoop
      summary: "触发闭环流水线"
      description: "触发端到端闭环流水线：JD 输入 → 技能抽取 → 图谱更新 → 匹配诊断 → 学习路径"
      tags: [闭环验证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoopRunRequest"
      responses:
        "200":
          description: "闭环运行结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopRunResponse"

  /loop/status/{run_id}:
    get:
      operationId: getLoopStatus
      summary: "闭环运行状态"
      description: "获取指定闭环运行的状态和结果"
      tags: [闭环验证]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "运行状态"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: "运行记录不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /loop/history:
    get:
      operationId: getLoopHistory
      summary: "闭环运行历史"
      description: "获取闭环运行历史记录"
      tags: [闭环验证]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: "运行历史"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object

  # ──────────────────────── Judge 评估 ────────────────────────
  /judge/evaluate:
    post:
      operationId: judgeEvaluate
      summary: "单样本评估"
      description: "golden vs system，计算 F1 并可启用 LLM judge"
      tags: [Judge 评估]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeRequest"
      responses:
        "200":
          description: "评估结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeSampleResponse"
        "502":
          description: "LLM 服务错误"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "评估失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /judge/pairwise:
    post:
      operationId: judgePairwise
      summary: "两两对比"
      description: "无 golden 参考，直接比较 output_b 相对 output_a 的 F1"
      tags: [Judge 评估]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairwiseRequest"
      responses:
        "200":
          description: "对比结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairwiseResponse"
        "500":
          description: "对比失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /judge/batch:
    post:
      operationId: judgeBatch
      summary: "批量评估"
      description: "读取 golden/system JSONL 文件，返回汇总指标和质检门禁"
      tags: [Judge 评估]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchJudgeRequest"
      responses:
        "200":
          description: "批量评估结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchJudgeResponse"
        "404":
          description: "文件未找到"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "评估失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────────────────── 数据流水线 ────────────────────────
  /pipeline/status:
    get:
      operationId: getPipelineStatus
      summary: "流水线状态概览"
      description: "获取全局流水线运行状态、成功率、各阶段统计"
      tags: [数据流水线]
      responses:
        "200":
          description: "流水线状态"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStatusResponse"

  /pipeline/runs:
    get:
      operationId: listPipelineRuns
      summary: "流水线运行记录"
      description: "分页查询流水线运行历史"
      tags: [数据流水线]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: status
          in: query
          schema:
            type: string
          description: "按状态筛选"
      responses:
        "200":
          description: "运行记录列表"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineRunResponse"

  /pipeline/runs/{run_id}:
    get:
      operationId: getPipelineRunDetail
      summary: "流水线运行详情"
      description: "获取单次流水线运行的完整详情，包含各阶段状态"
      tags: [数据流水线]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "运行详情"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunResponse"
        "404":
          description: "运行记录不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pipeline/runs/{run_id}/cancel:
    post:
      operationId: cancelPipelineRun
      summary: "取消流水线运行"
      description: "软取消 + Redis STOP flag + Celery 阶段开始时检查"
      tags: [数据流水线]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "取消成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"

  /pipeline/runs/{run_id}/retry:
    post:
      operationId: retryPipelineStage
      summary: "重试失败阶段"
      description: "重试指定流水线运行的失败阶段（断点续跑）"
      tags: [数据流水线]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage_name]
              properties:
                stage_name:
                  type: string
      responses:
        "200":
          description: "重试成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunResponse"
        "404":
          description: "运行记录不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pipeline/runs/{run_id}/resume:
    post:
      operationId: resumePipelineRun
      summary: "断点续跑"
      description: "重置所有失败阶段并继续执行"
      tags: [数据流水线]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "续跑成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunResponse"
        "404":
          description: "运行记录不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pipeline/trigger:
    post:
      operationId: triggerPipeline
      summary: "触发流水线"
      description: "手动触发一次数据流水线运行（DAG 执行，支持阶段选择）"
      tags: [数据流水线]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRequest"
      responses:
        "200":
          description: "流水线已触发"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"

  /pipeline/stages:
    get:
      operationId: getPipelineStages
      summary: "各阶段实时状态"
      description: "获取流水线各阶段（爬虫/去重/清洗/入库/图谱同步）的实时状态"
      tags: [数据流水线]
      responses:
        "200":
          description: "阶段状态"
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: array
                    items:
                      type: object

  /pipeline/data-quality:
    get:
      operationId: getPipelineDataQuality
      summary: "数据质量实时指标"
      description: "获取流水线数据质量指标和告警"
      tags: [数据流水线]
      responses:
        "200":
          description: "数据质量指标"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityResponse"

  /pipeline/datasources:
    get:
      operationId: getPipelineDatasources
      summary: "流水线数据源列表"
      description: "获取流水线相关数据源列表及状态"
      tags: [数据流水线]
      responses:
        "200":
          description: "数据源列表"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceResponse"

  /pipeline/events:
    get:
      operationId: pipelineEvents
      summary: "流水线 SSE 事件流"
      description: "SSE 实时流水线进度事件流"
      tags: [数据流水线]
      responses:
        "200":
          description: "SSE 事件流"
          content:
            text/event-stream:
              schema:
                type: string

  /pipeline/events-poll:
    get:
      operationId: pollPipelineEvents
      summary: "流水线事件轮询"
      description: "SSE 轮询回退，返回最近事件数组"
      tags: [数据流水线]
      parameters:
        - name: since
          in: query
          schema:
            type: number
            default: 0.0
          description: "Unix 时间戳筛选"
      responses:
        "200":
          description: "最近事件"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /pipeline/schedules:
    get:
      operationId: listSchedules
      summary: "定时调度列表"
      description: "列出所有定时调度"
      tags: [数据流水线]
      responses:
        "200":
          description: "调度列表"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleResponse"
    post:
      operationId: createSchedule
      summary: "创建定时调度"
      description: "创建定时调度（创建时计算 next_run_at）"
      tags: [数据流水线]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreateRequest"
      responses:
        "200":
          description: "调度已创建"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"

  /pipeline/schedules/{schedule_id}:
    put:
      operationId: updateSchedule
      summary: "更新定时调度"
      description: "更新定时调度配置"
      tags: [数据流水线]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreateRequest"
      responses:
        "200":
          description: "调度已更新"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "404":
          description: "调度不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSchedule
      summary: "删除定时调度"
      description: "删除指定定时调度"
      tags: [数据流水线]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "调度已删除"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"
        "404":
          description: "调度不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pipeline/schedules/{schedule_id}/trigger:
    post:
      operationId: triggerSchedule
      summary: "手动触发调度"
      description: "读取调度配置并触发流水线"
      tags: [数据流水线]
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "调度已触发"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "404":
          description: "调度不存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pipeline/config:
    get:
      operationId: getPipelineConfig
      summary: "获取流水线配置"
      description: "获取流水线配置（超时/并发/重试）"
      tags: [数据流水线]
      responses:
        "200":
          description: "流水线配置"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineConfigResponse"
    put:
      operationId: updatePipelineConfig
      summary: "更新流水线配置"
      description: "更新流水线配置（写入 .env 或运行时覆盖）"
      tags: [数据流水线]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineConfigUpdateRequest"
      responses:
        "200":
          description: "配置已更新"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineConfigResponse"

  /pipeline/analyze:
    post:
      operationId: analyzePipeline
      summary: "求职者分析 Pipeline（SSE）"
      description: "上传简历，执行完整的6步求职者分析 Pipeline，返回 SSE 流"
      tags: [数据流水线]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume_file]
              properties:
                resume_file:
                  type: string
                  format: binary
                  description: "求职者简历文件（PDF/DOCX）"
                target_positions:
                  type: string
                  description: "目标岗位列表，逗号分隔（可选）"
      responses:
        "200":
          description: "SSE 分析结果流"
          content:
            text/event-stream:
              schema:
                type: string

  /pipeline/export:
    post:
      operationId: exportAnalysis
      summary: "求职者分析 Pipeline（JSON）"
      description: "上传简历并返回 JSON 格式的完整分析结果"
      tags: [数据流水线]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume_file]
              properties:
                resume_file:
                  type: string
                  format: binary
                  description: "求职者简历文件（PDF/DOCX）"
                target_positions:
                  type: string
                  description: "目标岗位列表，逗号分隔（可选）"
      responses:
        "200":
          description: "JSON 分析结果"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Bearer token obtained from authentication endpoint"
  schemas:
    ExtractionRequest:
      type: object
      required: [jd_content]
      properties:
        jd_content:
          type: string
          minLength: 1
          maxLength: 50000
          description: "职位描述文本"
          example: "负责后端服务架构设计与开发，精通 Python/Go，熟悉分布式系统..."
        options:
          type: object
          nullable: true
          description: "抽取选项（model, temperature 等）"
          example:
            model: "generalv3.5"
            temperature: 0.1

    ExtractionResult:
      type: object
      properties:
        position_name:
          type: string
          description: "抽取的岗位名称"
          example: "后端开发工程师"
        required_skills:
          type: array
          description: "必需技能列表"
          items:
            type: object
            properties:
              skill:
                type: string
                example: "Python"
              category:
                type: string
                example: "hard_skill"
              proficiency:
                type: string
                example: "精通"
          default: []
        preferred_skills:
          type: array
          description: "加分技能列表"
          items:
            type: object
            properties:
              skill:
                type: string
                example: "Kubernetes"
              category:
                type: string
                example: "hard_skill"
              proficiency:
                type: string
                example: "熟悉"
          default: []
        experience_required:
          type: integer
          nullable: true
