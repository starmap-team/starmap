          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pipeline/runs/{run_id}/force-reset:
    post:
      operationId: force_reset_pipeline_api_v1_pipeline_runs__run_id__force_reset_post
      summary: Force Reset Pipeline
      description: 'Phase 3.8.5: 强制重置卡死的 run (is_running=true 但无 stage running).


        适用场景: advance_pipeline 失败, run 处于幽灵 running 状态。

        操作: 取消这个 run, 但不清空 stage 数据, 方便用户查看发生了什么。'
      tags:
      - 数据流水线
      - 数据流水线
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /positions/industries:
    get:
      operationId: listPositionIndustries
      summary: 行业列表
      description: 返回去重排序后的岗位行业名称列表（PLAN-011 契约补全）
      tags:
      - 岗位管理
      responses:
        '200':
          description: 行业列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  industries:
                    type: array
                    description: 去重排序后的行业名称列表
                    items:
                      type: string
  /import/jd:
    post:
      operationId: importJdCsv
      summary: CSV 上传导入 JD
      description: 管理员上传 CSV 文件导入 JD（需 admin 权限，写 audit log）。PLAN-011 契约补全。
      tags:
      - JD 导入
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - source_name
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV 文件（需含 job_title + clean_text 列）
                source_name:
                  type: string
                  maxLength: 100
                  description: 数据源标注
                platform:
                  type: string
                  description: 平台标识
                  default: manual
      responses:
        '200':
          description: 导入结果统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: 文件无效或无可导入项
  /import/jd/json:
    post:
      operationId: importJdJson
      summary: JSON 直接导入 JD
      description: 管理员以 JSON 请求体导入 JD（需 admin 权限，写 audit log）。PLAN-011 契约补全。
      tags:
      - JD 导入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: 导入结果统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: items 为空
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health-monitor/sources:
    get:
      operationId: listSourceHealth
      summary: 数据源健康度
      description: 返回每个数据源的 24h 健康度（需 admin 权限）。PLAN-011 契约补全。
      tags:
      - 健康度监控
      responses:
        '200':
          description: 数据源健康度汇总
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
  /health-monitor/sources/{source_id}/resume:
    post:
      operationId: resumeSource
      summary: 恢复暂停的数据源
      description: 将 paused 数据源恢复为 active 并清除 auto_paused 标记（需 admin 权限）。PLAN-011 契约补全。
      tags:
      - 健康度监控
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 恢复结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
        '404':
          description: 数据源不存在
  /admin/data-truth:
    get:
      operationId: getDataTruth
      summary: 数据源真相对账
      description: 返回每个 KPI 的 API/PostgreSQL/Neo4j 三层口径对比 + 同步健康度（需 admin 权限）。PLAN-011 契约补全。
      tags:
      - 管理后台
      responses:
        '200':
          description: 三口径对账报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruthReport'
  /admin/orphan-queue:
    get:
      operationId: getOrphanQueue
      summary: 孤儿节点审批队列
      description: 返回待审批的 Neo4j 孤儿节点（无 canonical_id 或 PG 无对应记录）。查看前自动同步最新检测结果（需 admin 权限）。P2 数据统一方案。
      tags:
      - 管理后台
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 按状态过滤（pending/approved/rejected/cleaned），默认 pending
      responses:
        '200':
          description: 孤儿队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanQueueResponse'
  /admin/orphan-queue/batch-action:
    post:
      operationId: orphanQueueBatchAction
      summary: 孤儿批量审批
      description: 批量批准/拒绝孤儿。only_no_reference=true 仅处理无引用孤儿（删除安全）。P2.1。
      tags:
      - 管理后台
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrphanBatchActionRequest'
      responses:
        '200':
          description: 批量审批结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanBatchActionResponse'
  /admin/orphan-queue/backfill-skills:
    post:
      operationId: orphanQueueBackfillSkills
      summary: 历史技能补录
      description: 把图中存在但 PG 无记录的 Skill 回填 skill_records + 链接 canonical_id。非破坏、幂等。P3b。
      tags:
      - 管理后台
      responses:
        '200':
          description: 补录结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanBackfillResponse'
  /admin/orphan-queue/{item_id}/link:
    post:
      operationId: orphanQueueLink
      summary: 孤儿链接
      description: 把无 canonical_id 节点 SET 到 PG 记录（非破坏、可逆）。canonical_id 缺省用检测建议值。P3a。
      tags:
      - 管理后台
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrphanLinkRequest'
      responses:
        '200':
          description: 链接后的队列条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanQueueItem'
  /admin/orphan-queue/{item_id}/action:
    post:
      operationId: orphanQueueAction
      summary: 孤儿审批（删除/拒绝）
      description: approve=删除孤儿节点（级联边）+审计；reject=拒绝清理。破坏性操作需 admin 权限。
      tags:
      - 管理后台
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrphanQueueActionRequest'
      responses:
        '200':
          description: 审批后的队列条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanQueueItem'
        '409':
          description: 状态冲突（如已审批/已清理）
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token obtained from authentication endpoint
  schemas:
    ExtractionRequest:
      type: object
      required:
      - jd_content
      properties:
        jd_content:
          type: string
          minLength: 1
          maxLength: 50000
          description: 职位描述文本
          example: 负责后端服务架构设计与开发，精通 Python/Go，熟悉分布式系统...
        options:
          type: object
          nullable: true
          description: 抽取选项（model, temperature 等）
          example:
            model: generalv3.5
            temperature: 0.1
    ExtractionResult:
      type: object
      properties:
        position_name:
          type: string
          description: 抽取的岗位名称
          example: 后端开发工程师
        required_skills:
          type: array
          description: 必需技能列表
          items:
            type: object
            properties:
              skill:
                type: string
                example: Python
              category:
                type: string
                example: hard_skill
              proficiency:
                type: string
                example: 精通
          default: []
        preferred_skills:
          type: array
          description: 加分技能列表
          items:
            type: object
            properties:
              skill:
                type: string
                example: Kubernetes
              category:
                type: string
                example: hard_skill
              proficiency:
                type: string
                example: 熟悉
          default: []
        experience_required:
          type: integer
          nullable: true
          description: 要求经验年数
          example: 3
        education_required:
          type: string
          nullable: true
          description: 学历要求
          example: 本科
        responsibilities:
          type: array
          description: 岗位职责描述
          items:
            type: string
          example:
          - 负责后端服务架构设计
          - 核心模块开发
          default: []
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 抽取置信度
          example: 0.92
        hallucination_score:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: 幻觉风险评分（null 表示未触发幻觉检测）
          example: 0.08
        normalized_skills:
          type: array
          description: 归一化后的技能列表
          items:
            type: object
            properties:
              original:
                type: string
                example: python3
              normalized:
                type: string
                example: Python
              method:
                type: string
                example: alias
              confidence:
                type: number
                example: 1.0
          default: []
        tools:
          type: array
          description: JD 提及的工具与框架
          items:
            type: object
          default: []
        learning_resources:
          type: array
          description: JD 提及的学习资源
          items:
            type: object
          default: []
        evolves_to:
          type: array
          description: 该岗位演进方向
          items:
            type: string
          default: []
        hallucinated_skills:
          type: array
          description: 反幻觉检查判定的幻觉技能
          items:
            type: string
          default: []
        missing_skills:
          type: array
          description: 缺失的核心技能
          items:
            type: string
          default: []
        issues:
          type: array
          description: 反幻觉检查问题清单
          items:
            type: string
          default: []
        model_used:
          type: string
          nullable: true
          description: 实际用于本次抽取的 LLM 模型标识（含本地降级回退时的模型名）
          example: qwen2.5-7b-fallback
    SkillNode:
      type: object
      required:
      - skill_id
      - name
      - category
      - proficiency
      - confidence
      - source_count
      properties:
        skill_id:
          type: string
          description: 技能唯一标识（归一化后的 ID）
          example: skill_python_3.x
        name:
          type: string
          description: 技能展示名称
          example: Python
        category:
          type: string
          enum:
          - hard_skill
          - soft_skill
          - tool
          - certificate
          description: 技能分类
          example: hard_skill
        proficiency:
          type: string
          enum:
          - 了解
          - 熟悉
          - 精通
          description: 熟练度等级
          example: 精通
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 该技能节点置信度
          example: 0.95
        source_count:
          type: integer
          minimum: 0
          description: 来源文档计数
          example: 15
    PositionNode:
      type: object
      required:
      - position_id
      - name
      - industry
      - description
      - skills_required
      properties:
        position_id:
          type: string
          example: pos_backend_engineer
        name:
          type: string
          example: 后端开发工程师
        industry:
          type: string
          example: 互联网/IT
        description:
          type: string
          example: 负责后端服务架构设计与核心模块开发
        skills_required:
          type: array
          items:
            $ref: '#/components/schemas/SkillNode'
        discovered_at:
          type: string
          format: date-time
          description: 发现时间
    GraphNode:
      type: object
      required:
      - id
      - labels
      - properties
      properties:
        id:
          type: string
          example: skill_python_3.x
        labels:
          type: array
          items:
            type: string
          example:
          - Skill
          - HardSkill
        properties:
          type: object
          description: 节点属性键值对
          additionalProperties: true
          example:
            name: Python
            category: hard_skill
            confidence: 0.95
    GraphEdge:
      type: object
      required:
      - source_id
      - target_id
      - type
      properties:
        source_id:
          type: string
          example: skill_python_3.x
        target_id:
          type: string
          example: pos_backend_engineer
        type:
          type: string
          example: REQUIRED_FOR
        properties:
          type: object
          description: 边属性
          additionalProperties: true
          example:
            weight: 0.9
    MatchRequest:
      type: object
      required:
      - person_skills
      - target_position
      properties:
        person_skills:
          type: array
          description: 个人技能列表
          items:
            type: object
            required:
            - name
            properties:
              skill_id:
                type: string
                nullable: true
              name:
                type: string
              category:
                type: string
                default: hard_skill
              proficiency:
                type: string
                default: 熟悉
              confidence:
                type: number
                default: 1.0
              source_count:
                type: integer
                default: 0
        target_position:
          type: string
          description: 目标岗位 ID 或名称
          example: pos_backend_engineer
        options:
          type: object
          properties:
            threshold:
              type: number
              format: float
              minimum: 0
              maximum: 1
              default: 0.6
              description: 匹配阈值，低于此值视为严重不匹配
    MatchResult:
      type: object
      required:
      - match_id
      - target_position
      - match_score
      - matched_skills
      - gap_skills
      - recommendations
      properties:
        match_id:
          type: string
        target_position:
          type: string
        match_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 总体匹配度
          example: 0.74
        matched_skills:
          type: array
          description: 已匹配技能
          items:
            type: string
          example:
          - Python
          - FastAPI
          - PostgreSQL
        gap_skills:
          type: array
          description: 差距技能（缺失或不足）
          items:
            type: string
          example:
          - Docker
          - Kubernetes
          - 分布式系统设计
        recommendations:
          type: array
          description: 学习路径建议
          items:
            type: string
          example:
          - 建议优先学习 Docker 容器化部署
          - 补充分布式系统理论知识
        missing_required:
          type: array
          items:
            type: string
        missing_bonus:
          type: array
          items:
            type: string
        skill_gap_detail:
          type: array
          items:
            type: object
            properties:
              skill:
                type: string
              importance:
                type: string
              gap_level:
                type: string
              learning_path:
                type: array
                items:
                  type: string
        overall_assessment:
          type: string
        estimated_learning_time:
          type: string
        cii:
          type: number
          nullable: true
        trust_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: 已掌握技能中 Neo4j Skill.trust_score 的最小值（瓶颈信任度）
        score_breakdown:
          $ref: '#/components/schemas/MatchScoreBreakdown'
          nullable: true
          description: 匹配分数拆解（必需/加分均值与权重、是否通胀修正）
        note:
          type: string
          nullable: true
          description: M2 补充说明（如岗位存在但无技能画像，无法计算匹配度）
    MatchScoreBreakdown:
      type: object
      required:
      - required_avg
      - bonus_avg
      - weight_required
      - weight_bonus
      - inflated
      properties:
        required_avg:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 必备技能匹配均值
        bonus_avg:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 加分技能匹配均值
        weight_required:
          type: number
          format: float
          description: 必备权重 0.7
        weight_bonus:
          type: number
          format: float
          description: 加分权重 0.3
        inflated:
          type: boolean
          description: 是否应用了 CII 通胀修正
    BatchMatchResultItem:
      type: object
      required:
      - position_name
      properties:
        position_name:
          type: string
        result:
          $ref: '#/components/schemas/MatchResult'
        error:
          type: string
          nullable: true
    BatchMatchResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: 批量匹配结果（逐条隔离，单条失败记 error 不中断整批）
          items:
            $ref: '#/components/schemas/BatchMatchResultItem'
        items:
          type: array
          description: results 的别名（前端兼容按扁平 items 消费）
          items:
            $ref: '#/components/schemas/BatchMatchResultItem'
        summary:
          type: object
          properties:
            total:
              type: integer
            success:
              type: integer
            failed:
              type: integer
        total:
          type: integer
    CompetitivenessResponse:
      type: object
      required:
      - position
      - competitiveness_score
      - difficulty
      properties:
        position:
          type: string
        competitiveness_score:
          type: number
          description: 综合竞争力 0-1
        difficulty:
          type: string
          enum:
          - 高
          - 中
          - 低
        description:
          type: string
        skill_count:
          type: integer
        required_count:
          type: integer
        bonus_count:
          type: integer
        avg_proficiency_level:
          type: number
        avg_prerequisite_depth:
          type: number
        cii:
          type: number
        items:
          type: array
          description: 瓶颈技能别名（前端兼容）
          items:
            type: object
            properties:
              skill:
                type: string
              prerequisite_depth:
                type: integer
              learning_path:
                type: array
                items:
                  type: string
        skills:
          type: object
          description: 技能统计别名（前端兼容）
          properties:
            required_count:
              type: integer
            bonus_count:
              type: integer
            total:
              type: integer
        bottleneck_skills:
          type: array
          items:
            type: object
            properties:
              skill:
                type: string
              prerequisite_depth:
                type: integer
              learning_path:
                type: array
                items:
                  type: string
        skill_details:
          type: array
          items:
            type: object
            properties:
              skill:
                type: string
              prerequisite_depth:
                type: integer
              learning_path:
                type: array
                items:
                  type: string
    BatchMatchRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              position:
                type: string
              position_name:
                type: string
              skills:
                type: array
                items:
                  type: object
    ReverseMatchRequest:
      type: object
      required:
      - person_skills
      properties:
        person_skills:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              category:
                type: string
              proficiency:
                type: string
              confidence:
                type: number
              source_count:
                type: integer
        top_k:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
        min_score:
          type: number
          default: 0.3
          minimum: 0
          maximum: 1
    ReverseMatchResponse:
      type: object
      required:
      - recommendations
      - total_positions_scanned
      - skills_provided
      properties:
        recommendations:
          type: array
          items:
            type: object
            required:
            - position_name
            - match_score
            - matched_skills
            - gap_skills
            - skill_coverage
            properties:
              position_name:
                type: string
              match_score:
                type: number
              matched_skills:
                type: array
                items:
                  type: string
              gap_skills:
                type: array
                items:
                  type: string
              skill_coverage:
                type: number
        total_positions_scanned:
          type: integer
        skills_provided:
          type: integer
    QualityReport:
      type: object
      required:
      - precision
      - recall
      - f1
      - warning_level
      - details
      properties:
        precision:
          type: number
          format: float
          minimum: 0
          maximum: 1
