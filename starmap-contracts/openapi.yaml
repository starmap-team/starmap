          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128

    LoginResponse:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          type: object
          additionalProperties: true

    RefreshRequest:
      type: object
      required: [refresh_token]
