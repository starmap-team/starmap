          type: number
          nullable: true
        llm_reasoning:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        evaluated_at:
          type: string

    PairwiseResponse:
      type: object
      properties:
        sample_id:
          type: string
        precision_b_vs_a:
          type: number
        recall_b_vs_a:
          type: number
        f1_b_vs_a:
          type: number
        errors:
          type: array
          items:
            type: string
        evaluated_at:
          type: string

    BatchJudgeResponse:
      type: object
      properties:
