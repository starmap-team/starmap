          type: string
          nullable: true
          format: email
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        failed_login_attempts:
          type: integer
        locked_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

