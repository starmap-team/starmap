          type: string
          format: date-time
          nullable: true
        total_records:
          type: integer
        valid_records:
          type: integer
        duplicate_rate:
          type: number
          format: float
        avg_quality_score:
          type: number
          format: float
        config:
          type: object
          additionalProperties: true

