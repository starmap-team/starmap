[project]
name = "starmap-backend"
version = "0.1.0"
description = "星图(StarMap) 人才能力星云导航系统 - 后端"
authors = [{name = "StarMap Team"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"

# ---------- 核心依赖（精确锁定版本，规范3） ----------
dependencies = [
    # Web 框架
    "fastapi (>=0.119,<0.140)",
    "uvicorn[standard] (>=0.27,<0.30)",
    "pydantic (>=2.6,<3.0)",
    "pydantic-settings (>=2.2,<3.0)",
    "email-validator (>=2.0)",            # Pydantic EmailStr support
    "python-multipart (>=0.0.9)",        # 文件上传（简历）
    # 数据库
    "sqlalchemy[asyncio] (>=2.0,<2.1)",
    "asyncpg (>=0.29,<0.30)",            # PostgreSQL 异步驱动
    "psycopg[binary] (>=3.1,<4.0)",      # crawler 同步 DB 驱动 (compliance_log/jd_raw, CI 测试依赖)
    "alembic (>=1.13,<1.15)",            # 迁移（规范2：模型变更必走迁移）
    "neo4j (>=5.17,<6.0)",               # Neo4j Python driver
    "chromadb (>=0.5,<0.6)",             # 向量库
    "redis (>=5.0,<6.0)",
    # 任务队列
    "celery[redis] (>=5.3,<5.5)",
    # LLM / NLP
    "httpx (>=0.27,<0.28)",              # 异步调用星火 API
    # 文档解析
    "pdfplumber (>=0.10)",               # PDF 简历解析
    "python-docx (>=1.1)",               # Word 简历解析
    # 工具
    "pyyaml (>=6.0)",                    # YAML 解析（skill_taxonomy.yaml 归一化）
    "python-dotenv (>=1.0)",
    "loguru (>=0.7)",
    "croniter (>=1.0,<3.0)",             # cron 表达式解析（pipeline 定时调度；缺失时兜底退化为 +1h 触发）
    "tenacity (>=8.2,<9.0)",             # 重试
    "PyJWT (>=2.8,<3.0)",                # JWT 签发/验证 (SEC-01)
    "bcrypt (>=4.0,<5.0)",               # 密码哈希 (SEC-02)
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=4.1"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"          # 测试 FastAPI
ruff = ">=0.3"            # lint + format
mypy = ">=1.9"           # type check

# 应用项目（不发布到 PyPI），关闭打包模式
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---------- Ruff 配置（CI lint 门禁） ----------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_*"]  # 根目录 _*.py 临时诊断脚本不进 CI 门禁

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008"]   # E501: 行长由 formatter 管; B008: FastAPI 依赖注入标准模式

[tool.ruff.lint.isort]
# Force "app" to be recognised as first-party in every environment.
# Without this, CI Ruff (which runs from backend/ but has different
# source-root detection than local) classifies `from app.... import ...`
# as third-party, causing I001 in tests/unit/test_fixture_seed.py
# even though the isort-canonical order (third-party -> first-party)
# is correct locally.  Verified both Python 3.11.15 (CI) and 3.12.0
# (local) with ruff 0.15.20: only with this declaration does CI ruff
# accept module-level and in-function `from app....` imports as
# FirstParty; without it CI sorts them alphabetically as third-party
# against sqlalchemy.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# 独立调试脚本需先设置 sys.path / 环境变量再导入 app，E402 为预期模式
"real_*.py" = ["E402"]
# 模拟 httpx/DB 会话的替身类使用非常规方法名（self_inner 等），N805/N818 豁免
"tests/unit/test_integration_smoke.py" = ["N805", "N818"]
"tests/unit/test_stage3_outbox.py" = ["N805"]
# test_fixture_seed.py uses in-function imports to defer the
# app.data.fixtures.seed import until after the test's own fixture
# setup runs; ruff I001 in-function-block categorisation differs
# between local and CI (verified reproducible only inside the GitHub
# Actions runner), so we silence the rule for this single file.
"tests/unit/test_fixture_seed.py" = ["I001"]

# ---------- pytest 配置（覆盖率门禁 70%，与 addopts --cov-fail-under=70 对齐） ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# backend/ 自身（app 包）+ 仓库根目录（crawler 包，被 app.core.pipeline.executor
# 与 tests/unit/test_proxy_breaker.py 引用）。crawler 与 app 在容器内为同级目录，
# 本地测试通过 pythonpath 模拟同样的布局，无需改动测试源码。
pythonpath = [".", ".."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70 --ignore=tests/integration --ignore=tests/unit/test_contract_regression.py"
markers = [
    "smoke: marks tests as smoke suite (run on demand for pipeline E2E validation, Phase 10 PIPE-04)",
    "e2e: marks tests as full end-to-end (slow, run separately)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# SEC-04 fix: 逐步开启类型安全选项
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false  # 逐步开启，当前仍有大量无注解函数
disallow_any_generics = false  # 逐步开启

# 新模块类型检查较宽松，逐步完善
# Phase 15: core matching, graph_service, match_service, celery_app unlocked
# mypy.ini provides fine-grained per-module disable_error_code overrides;
# the previous ignore_errors=true block here was dead config (mypy.ini takes
# precedence). Removed in PR-B to surface the real mypy debt.
