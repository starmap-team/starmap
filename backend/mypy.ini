[mypy]
python_version = 3.11
ignore_missing_imports = True
strict = False
warn_return_any = False
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False
disallow_untyped_defs = False
disallow_incomplete_defs = True
check_untyped_defs = True

# Suppress specific error codes for known patterns
[mypy-app.services.graph_service]
disable_error_code = index, attr-defined

[mypy-app.api.v1.graph]
disable_error_code = arg-type, no-redef

[mypy-app.api.v1.admin]
disable_error_code = call-arg

[mypy-app.api.v1.evolution]
disable_error_code = arg-type

# match.py: Result type confusion (SQLAlchemy Result vs dict)

# Celery bind=True adds untyped self param
[mypy-app.tasks.celery_app]
disable_error_code = no-untyped-def

# outbox retry worker: Celery bind=True 同款（Phase 23 Task 1）
[mypy-app.tasks.outbox_retry]
disable_error_code = no-untyped-def

# Loop orchestrator has Result type confusion from shared import name
[mypy-app.core.pipeline.loop_orchestrator]
disable_error_code = attr-defined, assignment, arg-type

# match.py: Result type confusion (SQLAlchemy Result vs dict)
[mypy-app.api.v1.match]
disable_error_code = assignment, attr-defined

# evolution_career_path: Neo4j record field types are dynamic
[mypy-app.api.v1.evolution_career_path]
disable_error_code = arg-type

# learning.py: SQLAlchemy column type confusion
[mypy-app.api.v1.learning]
disable_error_code = assignment

# graph_overview: dynamic dict key from tuple unpacking
[mypy-app.services.graph_overview]
disable_error_code = index

# (2026-08-14 门禁修复: 移除过时 section [mypy-app.api.v1.pipeline.schemas] —
# 该模块已不存在，mypy 报 unused section)
