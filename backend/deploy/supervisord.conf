; =============================================================================
; StarMap supervisord 配置 — 2c4G 单容器双进程
; uvicorn (1 worker) + celery worker (1 concurrency)
; =============================================================================

[supervisord]
nodaemon=true
user=starmap
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:uvicorn]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --access-log --no-use-colors
directory=/app
user=starmap
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/uvicorn.log
stderr_logfile=/var/log/supervisor/uvicorn.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:celery-worker]
command=celery -A app.tasks.celery_app.celery_app worker --loglevel=warning --concurrency=1 --max-tasks-per-child=100 -Q default,extraction,matching,graph
directory=/app
user=starmap
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/celery.log
stderr_logfile=/var/log/supervisor/celery.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
