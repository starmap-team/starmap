# Skill icon taxonomy (2026-08-17 技能图标系统)
#
# 背景: 整个项目无 skill icon 字段/字典 —— radar 图、技能图谱、技能选择器
# 全是 ECharts default 符号（空心圆）。这导致:
# 1. 雷达图/图谱节点无视觉辨识度（用户难以快速区分技能类型）
# 2. 候选技能选择时无图标引导
# 3. 数据支撑度「」无法快速传达技能类型
#
# 设计:
# - 按技能类别 (hard_skill/soft_skill/tool/certificate) 分组
# - icon 是 emoji 字符串（不依赖外部 CDN/字体，离线部署可用）
# - canonical 名称 + alias 映射（与 industry_taxonomy.yaml 同样模式）
# - 未登记的技能 → DEFAULT_ICON (fallback)
#
# 100+ 技能覆盖 IT 行业 90%+ 高频技能，余下未登记技能用 fallback。

# 通用 fallback（未登记技能）
DEFAULT_ICON: "⚡"

