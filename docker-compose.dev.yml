# =============================================================================
# 星图(StarMap) 开发环境 Docker Compose
# 规范3（§17.4）：开发也用 Docker，依赖精确锁定。
# 启动：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml stop
# =============================================================================
name: starmap-dev

services:
  # ---------- 后端 API（热重载） ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: starmap-backend
    volumes:
      - ./backend:/app           # 代码挂载，支持热重载
      - ./crawler:/app/crawler   # Phase 15-02: CSV 导入端点需要 crawler.persistence.dao
      - ./scripts:/app/repo-scripts:ro  # 演示数据 seed_*.py（挂载到 /app/repo-scripts，不覆盖 backend/scripts/）
      - ./starmap-contracts:/contracts:ro  # 契约只读挂载，启动校验一致性
      - ./docs:/app/docs:ro      # 文档挂载（ontology/skill_taxonomy.yaml 等）
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NO_PROXY=*
      - no_proxy=*
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started
    # W1-fix: 把 --reload 监听范围收敛到真正的代码目录 /app/app，
    # 否则后端根目录下的随手脚本（test_cat.py / check_pg_data.py 等）被保存时会
    # 触发 uvicorn 热重载，而前端 SSE 长连接（pipeline/events、dashboard/realtime）
    # 无法在关闭阶段断开，导致旧 worker 卡死、新 worker 起不来 → 后端整体无响应。
    # 2026-08-11 修复: --timeout-graceful-shutdown 10 强制 reload 时最多等 10s
    # 关闭（含 SSE 长连接），避免 graceful shutdown 无限等待 → 改文件后后端假死、
    # 前端 30s axios 超时频繁弹"请求超时"。
    command: ["./entrypoint.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--reload-exclude=tests/*", "--reload-exclude=docs/*", "--reload-exclude=graphify-out/*", "--reload-exclude=test_*.py", "--timeout-graceful-shutdown", "10"]
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-worker:
    build:
      context: ./backend  # 2026-08-30 CI 修复: 与 backend 服务同 context —— Dockerfile.dev 的 COPY 相对 backend/, 仓库根无 pyproject.toml 导致冒烟 /pyproject.toml not found; crawler/docs 由 volumes 挂载
      dockerfile: Dockerfile.dev
    container_name: starmap-celery-worker
    volumes:
      - ./backend:/app
      - ./crawler:/app/crawler  # Phase 2 UAT 修复: crawler 挂载到 /app 下
      - ./docs:/app/docs:ro      # 文档挂载（ontology/skill_taxonomy.yaml 等）
    env_file:
      - .env
    environment:
      - NO_PROXY=*
      - no_proxy=*
      - PYTHONPATH=/app  # 让 Python 能找到 /app 下的模块（包括 /app/crawler）
      # Phase 10 PIPE-03 (c) D-03: 启动时若 PIPELINE_BOOTSTRAP=true → 30s 后入队一次 pipeline run
      # 默认 false（不触发）；开发者本地 .env 中可以 uncomment 改为 true 调试
      - PIPELINE_BOOTSTRAP=${PIPELINE_BOOTSTRAP:-false}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["./entrypoint.sh", "celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # ---------- 前端（Vite HMR） ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: starmap-frontend
    volumes:
      - ./frontend:/app
      - ./starmap-contracts:/app/starmap-contracts:ro  # PLAN-014 批次17: 契约 alias 容器可达
      - /app/node_modules   # 防止宿主 node_modules 覆盖容器内的
    ports:
      - "5173:5173"
    environment:
      # Vite proxy target — Docker 网络用服务名，不含路径
      - VITE_API_PROXY_TARGET=http://starmap-backend:8000
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_USE_MSW=false
      # 将 Vite 缓存目录移到 /tmp，避免匿名卷 node_modules 写权限问题
      - VITE_CACHE_DIR=/tmp/vite-cache
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 注意：不用 wget——Docker Desktop for Windows 的透明代理会劫持容器内
      # 到 127.0.0.1:5173 的出站到网关 192.168.65.254 导致连接被拒。
      # Node http.get() 不走系统代理，直连正常。
      test: ["CMD-SHELL", "node -e \"http.get('http://127.0.0.1:5173/',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # ---------- 图数据库 ----------
  neo4j:
    image: neo4j:5-community
    container_name: starmap-neo4j
    ports:
      - "7474:7474"   # 浏览器界面 http://localhost:7474
      - "7687:7687"   # Bolt 协议
    environment:
      - NEO4J_AUTH=neo4j/starmap123456
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # ---------- 关系数据库 ----------
  postgres:
    image: postgres:16
    container_name: starmap-postgres
    ports:
      - "5433:5432"   # Windows 宿主已有 Postgres 占用 5432，改用 5433
    environment:
      - POSTGRES_USER=starmap
      - POSTGRES_PASSWORD=starmap123456
      - POSTGRES_DB=starmap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starmap"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # ---------- 缓存 / 消息队列 ----------
  redis:
    image: redis:7-alpine
    container_name: starmap-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-starmap_dev_redis} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # ---------- 向量数据库 ----------
  chroma:
    image: chromadb/chroma:0.5.3
    container_name: starmap-chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # ---------- 本地大模型 (Qwen2.5-7B) ----------
  # 通过 Ollama 提供 OpenAI 兼容 API，供抽取 fallback 和本地评测使用
  # 首次启动会自动拉取模型（~4.5GB），耗时取决于网络
  # API 地址: http://localhost:11434/v1/chat/completions
  ollama:
    image: ollama/ollama:0.5.0
    # 可选 LLM 服务：默认 `up -d` 不启动，避免镜像拉取（国内镜像常 429 限流）
    # 或无效标签阻塞整个栈。需要本地 Qwen 时：
    #   docker compose -f docker-compose.dev.yml --profile llm up -d
    profiles: ["llm"]
    container_name: starmap-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q qwen2.5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 首次拉取模型需要时间
    restart: unless-stopped
    # 开发模式：容器停止后保留，不自动删除
    stop_signal: SIGTERM
    stop_grace_period: 10s

  # 模型初始化容器（拉取 Qwen2.5-7B 到 Ollama 卷中，一次性的）
  ollama-pull:
    image: ollama/ollama:0.5.0
    profiles: ["llm"]
    container_name: starmap-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        echo '等待 Ollama 服务就绪...'
        for i in 1 2 3 4 5; do
          if ollama list >/dev/null 2>&1; then
            echo 'Ollama 就绪，开始拉取模型...'
            break
          fi
          echo '等待 Ollama... 重试 #'$$i
          sleep 10
        done
        ollama pull qwen2.5:7b && echo '模型就绪' || echo '模型拉取失败，将在下次启动时重试'
      "
    restart: "no"

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:

