name: Security Audit
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          # 扫描硬编码密钥模式
          ! grep -rnE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16}|tp-[a-zA-Z0-9]{20,}|password\s*=\s*["\x27][^"\x27]{4,}["\x27])' \
            backend/ frontend/ --include='*.py' --include='*.ts' --include='*.vue' --include='*.json'

      - name: Check .env not tracked
        run: |
          TRACKED=$(git ls-files | grep -E '\.env$|\.env\.local$|\.env\.docker$|\.pem$|id_rsa$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::敏感文件被 git 跟踪: $TRACKED"
            exit 1
          fi

      - name: Verify .gitignore
        run: |
          grep -q '^\.env$' .gitignore
          grep -q '^\.env\.local$' .gitignore

      - name: Install Python deps
        run: pip install bandit safety

      - name: Run bandit (SAST)
        run: bandit -r backend/app/ -ll -f json -o bandit-report.json || true

      - name: Check Python dependencies (safety)
        run: |
          cd backend
          safety check --file pyproject.toml || true

      - name: Check Node vulnerabilities
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Check Docker images for latest tags
        run: |
          LATEST=$(grep -E 'image:.*:latest' docker-compose.*.yml || true)
          if [ -n "$LATEST" ]; then
            echo "::warning::Docker 镜像使用 latest 标签: $LATEST"
          fi

      - name: Check for debug endpoints
        run: |
          # 检查生产环境是否禁用 Swagger
          if grep -q 'docs_url=' backend/app/main.py; then
            echo "✅ docs_url 已配置"
          else
            echo "::warning::FastAPI docs_url 未配置，生产环境可能暴露 Swagger"
          fi
